spring:
  datasource:
    url: jdbc:h2:mem:galpi;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-key-please-override-min-32-bytes-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins:
    - http://localhost:3000
