spring:
  # 테스트는 H2 create-drop으로 스키마를 만든다. Flyway(MySQL 전용 마이그레이션)는 끈다.
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:galpi;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-key-please-override-min-32-bytes-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins:
    - http://localhost:3000

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
