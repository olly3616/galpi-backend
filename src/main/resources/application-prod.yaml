# 운영(prod) 프로파일. SPRING_PROFILES_ACTIVE=prod 로 활성화.
# application.yaml(공통/dev 기본값) 위에 아래 항목만 덮어쓴다.
spring:
  jpa:
    hibernate:
      # 운영에선 스키마 자동 변경 금지. 앱은 스키마를 '검증'만 하고, 변경은 마이그레이션 도구로 관리한다.
      # ⚠ 최초 배포 전 스키마가 준비돼 있어야 한다(Flyway 도입 = A-2 후속). 빈 DB에 validate로 뜨면 기동 실패.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

# 운영에선 API 문서를 노출하지 않는다(엔드포인트/파라미터 구조가 공격자에게 지도가 되므로).
# 프론트용 문서는 로컬 Swagger·API 아티팩트·스테이징에서 확인한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 로그는 최소화(민감정보·성능). SQL은 남기지 않는다.
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

# 운영 프론트엔드 도메인만 CORS 허용. 실제 배포 도메인으로 교체할 것.
cors:
  allowed-origins:
    - https://galpi.example.com
