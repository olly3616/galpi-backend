spring:
  application:
    name: galpi-backend
  datasource:
    url: jdbc:mysql://localhost:3306/galpi
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # 응답을 서비스 계층에서 DTO로 변환하고 fetch join을 쓰므로 OSIV 비활성화(커넥션 조기 반환).
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # 반드시 환경변수로 주입 (최소 32바이트). 미설정 시 애플리케이션 기동 실패 — 하드코딩 기본값 금지(보안).
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

cors:
  # 웹 프론트엔드 출처 허용 목록. 실제 배포 도메인을 추가하세요.
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
