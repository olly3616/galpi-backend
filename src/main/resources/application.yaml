# ─────────────────────────────────────────────────────────────
# 이 파일은 공통 + 로컬 개발(dev) 기본값이다. 프로파일 없이 실행하면 이 설정으로 뜬다.
#   - 로컬 개발 : 아무 프로파일 없이 실행 → Swagger ON, ddl-auto=update (편의 우선)
#   - 스테이징  : SPRING_PROFILES_ACTIVE=staging → application-staging.yaml 이 덮어씀 (Swagger ON)
#   - 운영      : SPRING_PROFILES_ACTIVE=prod    → application-prod.yaml 이 덮어씀 (Swagger OFF, 잠금)
# 브랜치가 아니라 '실행 시 환경변수'로 환경을 고른다. 코드(main)는 하나다.
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: galpi-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://localhost:3306/galpi
    username: root
    password: ${DB_PASSWORD}
  # 로컬 개발에선 Flyway를 끄고 ddl-auto=update로 편하게 개발한다.
  # (운영/스테이징 프로파일에서만 Flyway를 켜 스키마를 관리한다.)
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # 응답을 서비스 계층에서 DTO로 변환하고 fetch join을 쓰므로 OSIV 비활성화(커넥션 조기 반환).
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # 반드시 환경변수로 주입 (최소 32바이트). 미설정 시 애플리케이션 기동 실패 — 하드코딩 기본값 금지(보안).
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    # 표지 이미지 업로드용 S3 버킷명. 자격증명(AccessKey/SecretKey)은
    # AWS SDK 기본 체인이 환경변수(AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)에서 읽는다.
    bucket: ${AWS_S3_BUCKET:}

fcm:
  # true일 때만 실제 FCM 발송. 기본(false)이면 로깅만 하므로 Firebase 키 없이 기동된다.
  enabled: ${FCM_ENABLED:false}
  # Firebase 서비스 계정 키(JSON) 파일 경로
  credentials-path: ${FCM_CREDENTIALS_PATH:}

cors:
  # 웹 프론트엔드 출처 허용 목록. 실제 배포 도메인을 추가하세요.
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
