spring:
  application:
    name: galpi-backend
  datasource:
    url: jdbc:mysql://localhost:3306/galpi
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-min-32-bytes-long}
  access-token-expiration: 3600000 # 1시간 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)
